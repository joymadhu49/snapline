<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snapline hero</title>
<!--
  README hero, drawn in HTML. Rendered twice (light and dark) by Scripts/make_readme_art.sh
  into docs/hero-light.png and docs/hero-dark.png on a transparent background.
-->
<style>
  :root {
    --title: #1f2328;
    --tagline: #59636e;
    --wall-a: #c9d6ff;
    --wall-b: #9fb4ff;
    --wall-c: #b9b0f5;
    --wall-glow: rgba(255,255,255,.55);
    --menubar: rgba(255,255,255,.55);
    --menubar-ink: rgba(20,24,40,.55);
    --frame-edge: rgba(15,20,40,.10);
    --win: #ffffff;
    --win-side: #f3f4f7;
    --win-bar: #f6f7f9;
    --win-line: #e6e8ee;
    --ink-1: #1f2430;
    --ink-2: #a9afbd;
    --ink-3: #d9dce4;
    --card: #ffffff;
    --card-line: #eceef3;
    --accent: #3366f0;
    --accent-2: #5b8cff;
    --dim: rgba(10,14,28,.34);
    --shadow: 0 30px 80px -20px rgba(30,40,90,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --title: #f0f6fc;
      --tagline: #9198a1;
      --wall-a: #1a2552;
      --wall-b: #2c45a8;
      --wall-c: #4a2f7e;
      --wall-glow: rgba(120,160,255,.30);
      --menubar: rgba(10,12,24,.45);
      --menubar-ink: rgba(235,240,255,.55);
      --frame-edge: rgba(255,255,255,.08);
      --win: #1b1d24;
      --win-side: #16181e;
      --win-bar: #20232b;
      --win-line: #2b2e38;
      --ink-1: #eef1f7;
      --ink-2: #5c6272;
      --ink-3: #343846;
      --card: #20232b;
      --card-line: #2c303b;
      --dim: rgba(0,0,0,.40);
      --shadow: 0 30px 80px -20px rgba(0,0,0,.7);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    width: 1600px; height: 1080px;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative; overflow: hidden;
  }
  h1 {
    position: absolute; top: 40px; left: 0; right: 0; text-align: center;
    font-size: 148px; font-weight: 700; letter-spacing: -0.048em; line-height: 1;
    color: var(--title);
  }
  .tag {
    position: absolute; top: 210px; left: 0; right: 0; text-align: center;
    font-size: 42px; font-weight: 500; letter-spacing: -0.02em; color: var(--tagline);
  }

  /* The desktop */
  .screen {
    position: absolute; left: 80px; top: 330px; width: 1440px; height: 700px;
    border-radius: 40px; overflow: hidden;
    background:
      radial-gradient(900px 520px at 78% 18%, var(--wall-glow), transparent 70%),
      linear-gradient(135deg, var(--wall-a) 0%, var(--wall-b) 52%, var(--wall-c) 100%);
    box-shadow: inset 0 0 0 1.5px var(--frame-edge);
  }
  .menubar {
    position: absolute; inset: 0 0 auto 0; height: 38px; background: var(--menubar);
    backdrop-filter: blur(20px);
    display: flex; align-items: center; padding: 0 26px; gap: 22px;
  }
  .pill { height: 10px; border-radius: 5px; background: var(--menubar-ink); }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--menubar-ink); }
  .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
  .sq { width: 22px; height: 12px; border-radius: 4px; background: var(--menubar-ink); }
  .mark { width: 22px; height: 22px; color: var(--ink-1); display: grid; place-items: center;
          border-radius: 6px; background: rgba(127,140,180,.22); }
  .mark svg { width: 20px; height: 20px; }

  /* The app window being captured */
  .win {
    position: absolute; left: 330px; top: 92px; width: 940px; height: 560px;
    border-radius: 18px; background: var(--win); overflow: hidden;
    box-shadow: var(--shadow), 0 0 0 1px var(--frame-edge);
    display: grid; grid-template-columns: 190px 1fr; grid-template-rows: 44px 1fr;
  }
  .win .bar { grid-column: 1 / 3; background: var(--win-bar); border-bottom: 1px solid var(--win-line);
              display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .tl { width: 12px; height: 12px; border-radius: 50%; }
  .side { background: var(--win-side); border-right: 1px solid var(--win-line); padding: 22px 18px;
          display: flex; flex-direction: column; gap: 16px; }
  .side .row { display: flex; align-items: center; gap: 10px; }
  .side .ic { width: 16px; height: 16px; border-radius: 5px; background: var(--ink-3); }
  .side .row.on .ic { background: var(--accent); }
  .side .row.on .ln { background: var(--ink-1); opacity: .55; }
  .ln { height: 8px; border-radius: 4px; background: var(--ink-3); }
  .main { padding: 28px 30px; display: flex; flex-direction: column; gap: 20px; }
  .h { height: 16px; width: 220px; border-radius: 6px; background: var(--ink-1); opacity: .85; }
  .grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; flex: 1; }
  .card { background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 20px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; color: var(--ink-1); margin-top: 10px; }
  .kpi .d { font-size: 13px; font-weight: 600; color: #2fa86b; margin-top: 4px; }
  .chart { display: flex; flex-direction: column; }
  .chart svg { flex: 1; width: 100%; margin-top: 12px; }
  .list { display: flex; flex-direction: column; gap: 16px; }
  .li { display: flex; align-items: center; gap: 12px; }
  .av { width: 30px; height: 30px; border-radius: 50%; flex: none; }

  /* Frozen screen dim with a hole for the selection */
  .sel { position: absolute;
         box-shadow: 0 0 0 4000px var(--dim); outline: 1.5px solid #fff; outline-offset: 0; border-radius: 1px; }
  .size { position: absolute; padding: 7px 12px; border-radius: 9px;
          background: rgba(18,20,28,.86); color: #fff; font: 600 16px/1 -apple-system, sans-serif;
          letter-spacing: .01em; font-variant-numeric: tabular-nums; box-shadow: 0 6px 18px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.22); }
  .cross { position: absolute; width: 40px; height: 40px; }

  /* Quick Access Overlay stack, bottom left */
  .qao { position: absolute; left: 30px; bottom: 30px; display: flex; flex-direction: column; gap: 14px; }
  .qc { width: 236px; height: 150px; border-radius: 14px; position: relative; overflow: hidden;
        box-shadow: 0 18px 40px -10px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.14); }
  .qc .shot { position: absolute; inset: 0; }
  .chip { position: absolute; left: 10px; top: 10px; padding: 5px 9px; border-radius: 7px;
          background: rgba(18,20,28,.82); color: #fff; font: 600 12px/1 -apple-system, sans-serif;
          display: flex; align-items: center; gap: 6px; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
  .hover { position: absolute; inset: 0; background: rgba(10,12,20,.5);
           display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn { padding: 8px 14px; border-radius: 9px; background: rgba(255,255,255,.94); color: #111;
         font: 600 14px/1 -apple-system, sans-serif; }
  .rb { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.92);
        display: grid; place-items: center; }
  .rb svg { width: 12px; height: 12px; }
</style>
</head>
<body>

<script>
  // Frame the chart card the way a deliberate capture would, then hang the crosshair and size label off its corner.
  const screen = document.querySelector('.screen').getBoundingClientRect()
  const r = document.querySelector('.chart').getBoundingClientRect()
  const pad = 14
  const x = r.left - screen.left - pad, y = r.top - screen.top - pad
  const w = r.width + pad * 2, h = r.height + pad * 2
  Object.assign(document.querySelector('.sel').style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' })
  Object.assign(document.querySelector('.cross').style, { left: x + w - 20 + 'px', top: y + h - 20 + 'px' })
  const size = document.querySelector('.size')
  size.textContent = `${Math.round(w * 2)} × ${Math.round(h * 2)}`
  Object.assign(size.style, { left: x + w + 16 + 'px', top: y + h + 14 + 'px' })
</script>
