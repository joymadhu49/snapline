<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snapline hero</title>
<!--
  README hero and demo, drawn in HTML. One scene, two uses:
    hero.html             the static hero: title, tagline and the illustrated desktop
    hero.html#demo        the desktop alone; Scripts/readme_frames.mjs calls render(t)
                          for every frame of docs/demo-*.gif
  Rendered by Scripts/make_readme_art.sh.
-->
<style>
  :root {
    --page: transparent;
    --title: #1f2328;
    --tagline: #59636e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --title: #f0f6fc; --tagline: #9198a1; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--page); }
  body {
    width: 1200px; height: 640px; position: relative; overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    position: absolute; top: 46px; left: 0; right: 0; text-align: center;
    font-size: 108px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; color: var(--title);
  }
  .tag {
    position: absolute; top: 172px; left: 0; right: 0; text-align: center;
    font-size: 36px; font-weight: 500; letter-spacing: -0.018em; color: var(--tagline);
  }

  /* The desktop banner */
  .banner {
    position: absolute; left: 50px; top: 270px; width: 1100px; height: 330px;
    border-radius: 30px; overflow: hidden;
    background:
      radial-gradient(520px 300px at 30% 110%, rgba(92,120,255,.20), transparent 70%),
      radial-gradient(600px 340px at 100% 100%, rgba(170,80,140,.30), transparent 70%),
      linear-gradient(118deg, #1d2148 0%, #2f2c66 46%, #3d2b62 76%, #4a2a58 100%);
    box-shadow: 0 30px 60px -30px rgba(10,10,30,.55);
    transform-origin: 0 0;
  }
  .menubar { position: absolute; inset: 0 0 auto 0; height: 28px; background: rgba(12,12,30,.38);
             display: flex; align-items: center; padding: 0 18px; gap: 9px; z-index: 1; }
  .menubar i { display: block; height: 7px; border-radius: 4px; background: rgba(220,222,240,.55); }
  .menubar .dot { width: 10px; height: 10px; border-radius: 50%; }
  .menubar .gap { width: 10px; background: none; }
  .menubar .right { margin-left: auto; display: flex; gap: 9px; align-items: center; }
  .menubar .sq { width: 17px; height: 10px; border-radius: 3px; }
  .menubar .mark { width: 15px; height: 15px; color: rgba(235,238,255,.85); }

  /* Glass frames around every illustrated thing on the desktop */
  .glass { position: absolute; padding: 5px; border-radius: 17px;
           background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.30);
           box-shadow: 0 18px 36px -14px rgba(5,5,25,.65), inset 0 1px 0 rgba(255,255,255,.25); }
  .glass > .in { width: 100%; height: 100%; border-radius: 12px; overflow: hidden; position: relative; }

  /* Chat window, left */
  .chat .in { background: #f7f7fa; }
  .chat .bar { height: 22px; background: #e9eaef; display: flex; gap: 5px; align-items: center; padding: 0 9px; }
  .chat .bar b { width: 7px; height: 7px; border-radius: 50%; }
  .msg { display: flex; gap: 8px; align-items: flex-start; padding: 0 12px; margin-top: 11px; }
  .msg .av { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .msg .lines i { display: block; height: 6px; border-radius: 3px; background: #d5d8e0; margin-top: 3px; }
  .msg .lines i:first-child { background: #b9bfcc; width: 46px; margin-top: 1px; }
  .bubble { position: absolute; right: 12px; bottom: 12px; width: 92px; height: 60px; border-radius: 9px; overflow: hidden;
            box-shadow: 0 0 0 2px #5b8cff; opacity: 0; transform-origin: 100% 100%; }

  /* Photo, centre: the thing being captured */
  .photo svg, .bubble svg, .qc svg, .drag svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Chart, right */
  .chart .in { background: #15161d; }

  /* Frozen overlay */
  .dim { position: absolute; border-radius: 1px; box-shadow: 0 0 0 3000px rgba(6,8,22,.34); z-index: 2; }
  .sel { position: absolute; outline: 1.5px solid #fff; z-index: 3; }
  .flash { position: absolute; background: #fff; z-index: 3; opacity: 0; }
  .size { position: absolute; z-index: 4; padding: 5px 8px; border-radius: 7px; background: rgba(16,18,26,.9); color: #fff;
          font: 600 12px/1 -apple-system, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap;
          box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
  .keys { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6; display: flex; gap: 6px;
          padding: 8px 10px; border-radius: 12px; background: rgba(16,18,28,.82); box-shadow: 0 10px 24px rgba(0,0,0,.4); opacity: 0; }
  .keys b { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 7px; background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.18); color: #fff; font: 600 16px/28px -apple-system, sans-serif; text-align: center; }

  /* Quick Access Overlay, bottom left */
  .qc { position: absolute; width: 168px; height: 108px; z-index: 5; padding: 4px; }
  .qc .in { border-radius: 10px; }
  .chip { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 5px; align-items: center; padding: 4px 7px; border-radius: 6px;
          background: rgba(14,16,24,.84); color: #fff; font: 600 10px/1 -apple-system, sans-serif; z-index: 2; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; }
  .hover { position: absolute; inset: 0; background: rgba(8,10,20,.5); display: flex; gap: 6px; align-items: center;
           justify-content: center; opacity: 0; z-index: 1; }
  .hover b { padding: 6px 10px; border-radius: 7px; background: rgba(255,255,255,.95); color: #111; font: 600 11px/1 -apple-system, sans-serif; }
  .drag { position: absolute; width: 168px; height: 108px; z-index: 7; padding: 4px; opacity: 0; transform-origin: 50% 50%; }
  .drag .in { border-radius: 10px; }

  .cursor { position: absolute; z-index: 9; width: 22px; height: 22px; }
  .cross { position: absolute; z-index: 9; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
</style>
</head>
<body>
  <h1>Snapline</h1>
  <div class="tag">Select it. Snap it. Drop it anywhere.</div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2a2d72"/><stop offset=".5" stop-color="#7a58a6"/><stop offset=".85" stop-color="#ee978a"/><stop offset="1" stop-color="#f7bd8c"/>
      </linearGradient>
      <symbol id="dusk" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice">
        <rect width="300" height="200" fill="url(#sky)"/>
        <circle cx="214" cy="62" r="34" fill="#fde9b4" opacity=".12"/>
        <circle cx="214" cy="62" r="20" fill="#fde9b4"/>
        <path d="M0 150 L52 104 L88 132 L140 74 L196 140 L232 112 L300 150 V200 H0Z" fill="#4a3f93"/>
        <path d="M140 74 L156 92 L148 90 L140 98 L130 90 L124 92Z" fill="#e9e3ff" opacity=".85"/>
        <path d="M0 172 L70 136 L118 160 L178 122 L240 166 L300 146 V200 H0Z" fill="#30296f"/>
      </symbol>
      <symbol id="code" viewBox="0 0 168 108" preserveAspectRatio="xMidYMid slice">
        <rect width="168" height="108" fill="#15161d"/>
        <g stroke-linecap="round" stroke-width="5">
          <path d="M16 22h34" stroke="#c792ea"/><path d="M58 22h52" stroke="#82aaff"/>
          <path d="M28 40h62" stroke="#c3e88d"/><path d="M98 40h26" stroke="#89ddff"/>
          <path d="M28 58h44" stroke="#f78c6c"/><path d="M80 58h40" stroke="#82aaff"/>
          <path d="M40 76h56" stroke="#c3e88d"/><path d="M16 92h22" stroke="#c792ea"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <div class="banner">
    <div class="menubar">
      <i class="dot"></i><i style="width:46px"></i><i style="width:32px"></i><i class="gap"></i><i style="width:28px"></i><i class="gap"></i><i style="width:40px"></i><i style="width:34px"></i>
      <div class="right">
        <svg class="mark" viewBox="240 200 540 620"><path fill="currentColor" d="M738 685V574C738 520 694 476 640 476H384C370 476 358 464 358 450V339C358 325 370 313 384 313H629V241H384C330 241 286 285 286 339V450C286 504 330 548 384 548H640C654 548 666 560 666 574V685C666 699 654 711 640 711H395V783H640C694 783 738 739 738 685Z"/><rect x="647" y="222" width="110" height="110" rx="24" fill="#7aa2ff"/><rect x="267" y="692" width="110" height="110" rx="24" fill="#7aa2ff"/></svg>
        <i class="sq"></i><i class="sq"></i><i class="sq"></i><i style="width:58px"></i>
      </div>
    </div>

    <div class="glass chat" style="left:236px;top:72px;width:236px;height:200px">
      <div class="in">
        <div class="bar"><b style="background:#ff5f57"></b><b style="background:#febc2e"></b><b style="background:#28c840"></b></div>
        <div class="msg"><div class="av" style="background:#f59e8b"></div><div class="lines"><i></i><i style="width:130px"></i><i style="width:96px"></i></div></div>
        <div class="msg"><div class="av" style="background:#8bd3c7"></div><div class="lines"><i></i><i style="width:112px"></i></div></div>
        <div class="bubble" id="bubble"><svg><use href="#dusk"/></svg></div>
      </div>
    </div>

    <div class="glass photo" id="photo" style="left:506px;top:62px;width:300px;height:200px">
      <div class="in"><svg><use href="#dusk"/></svg></div>
    </div>

    <div class="glass chart" style="left:838px;top:84px;width:230px;height:168px">
      <div class="in">
        <svg viewBox="0 0 220 158" style="position:absolute;inset:0;width:100%;height:100%">
          <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f8cff" stop-opacity=".45"/><stop offset="1" stop-color="#6f8cff" stop-opacity="0"/></linearGradient></defs>
          <rect x="16" y="16" width="62" height="7" rx="3.5" fill="#d9dbe6" opacity=".85"/>
          <rect x="16" y="30" width="38" height="5" rx="2.5" fill="#5e6273"/>
          <path d="M16 128 C40 120 52 98 74 104 S108 80 128 86 S160 52 180 58 S198 36 206 34 L206 150 L16 150Z" fill="url(#area)"/>
          <path d="M16 128 C40 120 52 98 74 104 S108 80 128 86 S160 52 180 58 S198 36 206 34" fill="none" stroke="#7d95ff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="180" cy="58" r="4.5" fill="#15161d" stroke="#a9b8ff" stroke-width="2.5"/>
        </svg>
      </div>
    </div>

    <div class="dim" id="dim"></div>
    <div class="sel" id="sel"></div>
    <div class="flash" id="flash"></div>
    <div class="size" id="size"></div>
    <div class="keys" id="keys"><b>⌥</b><b>⇧</b><b>4</b></div>

    <div class="glass qc" id="qcOld" style="left:24px;top:76px"><div class="in"><svg><use href="#code"/></svg></div></div>
    <div class="glass qc" id="qcNew" style="left:24px;top:198px">
      <div class="in"><svg><use href="#dusk"/></svg>
        <div class="hover" id="hover"><b>Copy</b><b>Save</b></div>
        <div class="chip" id="chip"><i></i>On clipboard</div>
      </div>
    </div>
    <div class="glass drag" id="drag"><div class="in"><svg><use href="#dusk"/></svg></div></div>

    <svg class="cross" id="cross" viewBox="0 0 26 26">
      <g stroke="#000" stroke-opacity=".5" stroke-width="3.6" stroke-linecap="round"><path d="M13 1v24M1 13h24"/></g>
      <g stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M13 1v24M1 13h24"/></g>
    </svg>
    <svg class="cursor" id="cursor" viewBox="0 0 22 22"><path d="M3 1.5l14.5 9.6-6.4 1.2-3.4 6.8z" fill="#0b0b0f" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>

<script>
  const $ = id => document.getElementById(id)
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
  const seg = (t, a, b) => clamp((t - a) / (b - a))
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
  const back = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2)
  const lerp = (a, b, x) => a + (b - a) * x
  const set = (el, s) => Object.assign(el.style, s)

  // The selection hugs the photo's glass frame. The size label reads in Retina pixels.
  const SEL = { x: 498, y: 54, w: 316, h: 216 }
  function marquee(w, h, show) {
    for (const el of [$('dim'), $('sel')]) set(el, { left: SEL.x + 'px', top: SEL.y + 'px', width: w + 'px', height: h + 'px', display: show ? 'block' : 'none' })
    set($('size'), { left: SEL.x + w + 10 + 'px', top: SEL.y + h + 10 + 'px', display: show && w > 8 ? 'block' : 'none' })
    $('size').textContent = `${Math.round(w * 4)} × ${Math.round(h * 4)}`
  }
  function pointer(x, y, kind) {
    set($('cursor'), { left: x - 3 + 'px', top: y - 1 + 'px', opacity: kind === 'arrow' ? 1 : 0 })
    set($('cross'), { left: x + 'px', top: y + 'px', opacity: kind === 'cross' ? 1 : 0 })
  }

  // The still hero: mid capture, with the previous shot waiting in the corner.
  window.heroPose = () => {
    marquee(SEL.w, SEL.h, true)
    $('chip').style.opacity = 1
    pointer(SEL.x + SEL.w, SEL.y + SEL.h, 'cross')
  }

  // One loop of the demo, 0 <= t < T seconds. Ends where it starts.
  window.T = 6.4
  window.render = t => {
    let kind = 'arrow'
    const p0 = ease(seg(t, 0, .7))
    let px = lerp(760, SEL.x, p0), py = lerp(300, SEL.y, p0)

    // The shortcut: keycaps, then the screen freezes and dims.
    $('keys').style.opacity = seg(t, .55, .7) * (1 - seg(t, 1.25, 1.45))
    $('dim').style.opacity = seg(t, .75, .9) * (1 - seg(t, 2.15, 2.35))
    if (t >= .75 && t < 2.15) kind = 'cross'

    // Drag out the marquee.
    const g = ease(seg(t, .95, 2.0))
    const w = SEL.w * g, h = SEL.h * g
    if (t >= .95) { px = SEL.x + w; py = SEL.y + h }
    marquee(w, h, t >= .95 && t < 2.35)
    $('sel').style.opacity = 1 - seg(t, 2.1, 2.2)
    $('size').style.opacity = 1 - seg(t, 2.1, 2.2)

    // Release: a soft flash inside the selection.
    set($('flash'), { left: SEL.x + 'px', top: SEL.y + 'px', width: SEL.w + 'px', height: SEL.h + 'px',
                      opacity: t >= 2.1 ? .5 * (1 - seg(t, 2.1, 2.32)) : 0 })

    // The capture snaps into the corner.
    const s = seg(t, 2.3, 2.8)
    set($('qcNew'), { transform: `translateX(${lerp(-210, 0, s === 0 ? 0 : back(s))}px)`, opacity: s > 0 && t < 4.5 ? 1 : 0 })
    $('chip').style.opacity = seg(t, 2.75, 2.95)
    $('qcOld').style.opacity = 0

    // Hover the card, then drag it into the chat.
    if (t >= 2.8) {
      const m = ease(seg(t, 2.8, 3.3))
      px = lerp(SEL.x + SEL.w, 108, m); py = lerp(SEL.y + SEL.h, 252, m)
      kind = 'arrow'
    }
    $('hover').style.opacity = seg(t, 3.25, 3.4) * (1 - seg(t, 3.6, 3.7))
    const d = ease(seg(t, 3.65, 4.45))
    if (t >= 3.65) {
      px = lerp(108, 392, d); py = lerp(252, 236, d)
      if (t < 4.5) $('qcNew').style.opacity = .35
    }
    const drop = seg(t, 4.45, 4.7)
    set($('drag'), {
      left: px - 84 + 'px', top: py - 54 + 'px',
      opacity: t >= 3.65 ? 1 - drop : 0,
      transform: `scale(${lerp(1, .62, d) * (1 - .4 * drop)}) rotate(${lerp(0, -4, d)}deg)`,
    })
    const b = seg(t, 4.5, 4.8)
    set($('bubble'), { opacity: b * (1 - seg(t, 5.9, 6.3)), transform: `scale(${lerp(.7, 1, b === 0 ? 0 : back(b))})` })
    if (t >= 4.7) { const a = ease(seg(t, 4.7, 5.6)); px = lerp(392, 560, a); py = lerp(236, 300, a) }
    if (t >= 5.6) { const a = ease(seg(t, 5.6, 6.4)); px = lerp(560, 760, a); py = 300 }

    pointer(px, py, kind)
  }

  if (location.hash === '#demo') {
    document.querySelector('h1').remove(); document.querySelector('.tag').remove()
    const bg = matchMedia('(prefers-color-scheme: dark)').matches ? '#0d1117' : '#ffffff'
    document.documentElement.style.setProperty('--page', bg)
    set(document.body, { width: '960px', height: '310px' })
    set(document.querySelector('.banner'), { left: '16px', top: '16px', transform: `scale(${928 / 1100})`, boxShadow: 'none' })
    render(0)
  } else {
    heroPose()
  }
</script>
</body>
</html>
